[package]
name = "cmf-buds"
version = "0.1.0"
edition = "2021"

[dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "time"] }

[profile.release]
lto = true
strip = true
